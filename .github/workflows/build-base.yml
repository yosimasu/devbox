name: build-base

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-base.yml
    tags:
      - "v*"
  workflow_dispatch: {}   # 允許手動觸發
  schedule:
    - cron: "0 18 * * 1"  # 週二清晨 02:00 (UTC+8) 定期重 build，跟上 base OS/mise/claude 更新

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devbox

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推 GHCR 需要
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3   # 讓 runner 能 build arm64
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 內建 token，不用自己的 PAT

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
